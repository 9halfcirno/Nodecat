<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1.0">
	<title>WebSocket Console with Colors</title>
	<style>
		/* 页面布局 */
		body {
		  margin: 0;
		  padding: 0;
		  font-family: Arial, sans-serif;
		  background-color: #f4f4f9;
		  color: #333;
		}
		
		/* 顶栏 */
		header {
		  background-color: #333;
		  color: #fff;
		  padding: 15px;
		  text-align: center;
		  font-size: 20px;
		  font-weight: bold;
		}
		
		/* 控制台输出区域 */
		#console-output {
		  height: calc(100vh - 80px); /* 60px是顶部栏高度，20px是按钮高度 */
		  overflow-y: auto;
		  padding: 15px;
		  background-color: #1e1e1e;
		  color: #fff;
		  font-family: monospace;
		  font-size: 14px;
		  white-space: pre-wrap;
		  border-bottom: 1px solid #444;
		}
		
		/* 自动吸附底部按钮 */
		.sticky-button {
		  position: fixed;
		  bottom: 30px;
		  right: 30px;
		  background-color: #28a745;
		  color: #fff;
		  border: none;
		  padding: 12px 20px;
		  font-size: 16px;
		  cursor: pointer;
		  border-radius: 8px;
		  box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
		  transition: background-color 0.3s, transform 0.2s;
		}
		
		.sticky-button:hover {
		  background-color: #218838;
		}
		
		.sticky-button:active {
		  transform: scale(0.95);
		}
		
		.sticky-button.disabled {
		  background-color: #d1d1d1;
		  cursor: not-allowed;
		}
		
		/* ANSI颜色类 */
		.ansi-black { color: black; }
		.ansi-red { color: red; }
		.ansi-green { color: green; }
		.ansi-yellow { color: yellow; }
		.ansi-blue { color: blue; }
		.ansi-magenta { color: magenta; }
		.ansi-cyan { color: cyan; }
		.ansi-white { color: white; }
		.ansi-bright-black { color: darkgray; }
		.ansi-bright-red { color: lightcoral; }
		.ansi-bright-green { color: lightgreen; }
		.ansi-bright-yellow { color: lightyellow; }
		.ansi-bright-blue { color: lightskyblue; }
		.ansi-bright-magenta { color: plum; }
		.ansi-bright-cyan { color: lightcyan; }
		.ansi-bright-white { color: whitesmoke; }
	</style>
	<script type="module">
		// ANSI颜色映射表
		const ansiColors = {
		  '30': 'ansi-black', '31': 'ansi-red', '32': 'ansi-green', '33': 'ansi-yellow',
		  '34': 'ansi-blue', '35': 'ansi-magenta', '36': 'ansi-cyan', '37': 'ansi-white',
		  '90': 'ansi-bright-black', '91': 'ansi-bright-red', '92': 'ansi-bright-green',
		  '93': 'ansi-bright-yellow', '94': 'ansi-bright-blue', '95': 'ansi-bright-magenta',
		  '96': 'ansi-bright-cyan', '97': 'ansi-bright-white'
		};
		
		// 转换ANSI颜色代码为HTML元素的class
		function parseAnsiColors(text) {
		  const ansiRegex = /\x1b\[([0-9;]*)m/g;
		  return text.replace(ansiRegex, (match, codes) => {
		    const classes = codes.split(';').map(code => ansiColors[code]).filter(Boolean);
		    return `<span class="${classes.join(' ')}">`;
		  }) + '</span>';
		}
		
		// WebSocket连接处理
		let autoScrollEnabled = true;
		
		const ws = new WebSocket('ws://localhost:8080');
		
		ws.onopen = () => {
		  console.log('Connected to WebSocket server');
		};
		
		// 接收到 WebSocket 消息并解析颜色
		ws.onmessage = (event) => {
		  const logElement = document.querySelector('#console-output');
		  const parsedMessage = parseAnsiColors(event.data);
		  logElement.innerHTML += parsedMessage + '<br>';
		
		  // 如果自动滚动启用，滚动到底部
		  if (autoScrollEnabled) {
		    logElement.scrollTop = logElement.scrollHeight;
		  }
		};
		
		ws.onerror = (error) => {
		  console.error('WebSocket Error:', error);
		};
		
		ws.onclose = () => {
		  console.log('Disconnected from WebSocket server');
		};
		
		// 控制自动吸附底部的按钮
		function toggleAutoScroll() {
		  autoScrollEnabled = !autoScrollEnabled;
		  const button = document.querySelector('.sticky-button');
		  button.textContent = autoScrollEnabled ? 'Disable Auto-Scroll' : 'Enable Auto-Scroll';
		}
	</script>
</head>

<body>

	<header>
		WebSocket Console
	</header>

	<div id="console-output">
		<!-- WebSocket 输出将显示在此区域 -->
	</div>

	<button class="sticky-button" onclick="toggleAutoScroll()">Disable Auto-Scroll</button>

</body>

</html>
